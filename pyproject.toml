[project]
name = "number-compiler"
version = "0.60.0"
description = "Canonical cross-family radix compiler for reverse-add, Collatz, primes, Fermat, and Mersenne sequences"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pip==26.2.1",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.17.1",
    "setuptools==84.0.0",
]
profile = ["pyinstrument==5.1.3"]

[project.scripts]
number-compiler = "number_compiler.api.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
number_compiler = [
    "kernels/*.zlib",
    "kernels/*.gz",
    "kernels/comma_semantic_future_v2.json",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not validation' --strict-markers"
markers = [
    "validation: exhaustive proofs, research sweeps, and end-to-end release workloads; run explicitly with -m validation",
    "algebra: finite semantic functions, quotient identities, and composition laws",
    "representation: source authority, lazy output, and forbidden-payload invariants",
    "accounting: resource ownership, budgets, inventories, and reporting",
    "proof: independent exact oracles and immutable kernel certificates",
    "cli: command-line parsing and validation",
]

[tool.mypy]
strict = true
files = ["src", "tests", "devtools"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "devtools"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN", "RUF100"]
preview = false
